[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "krx-signals"
version = "0.1.0"
description = "Rules-based technical analysis signals for Korean equities (KOSPI/KOSDAQ)"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "informstock", email = "economyinform@informstock.com" }]
keywords = ["krx", "kospi", "kosdaq", "technical-analysis", "signals", "korea"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Intended Audience :: Developers",
    "Intended Audience :: Financial and Insurance Industry",
    "Topic :: Office/Business :: Financial",
]
dependencies = ["pandas>=1.5", "numpy>=1.23"]

[project.optional-dependencies]
krx = ["pykrx>=1.0"]
dev = ["pytest>=7"]

[project.urls]
Homepage = "https://github.com/eomte86/krx-signals"
Repository = "https://github.com/eomte86/krx-signals"
Issues = "https://github.com/eomte86/krx-signals/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
