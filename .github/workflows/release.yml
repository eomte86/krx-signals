name: Release

# Publishes to PyPI via Trusted Publishing (OIDC) when a GitHub Release
# is created. No API tokens needed.
#
# One-time setup (maintainer):
#   1. Create an account at https://pypi.org/account/register/
#   2. PyPI -> Account settings -> Publishing -> "Add a new pending publisher":
#        PyPI Project Name: krx-signals
#        Owner:             eomte86
#        Repository name:   krx-signals
#        Workflow name:     release.yml
#   3. In this repo: Releases -> "Draft a new release" -> tag v0.1.0 -> Publish.
#      This workflow runs automatically and uploads the build to PyPI.

on:
  release:
    types: [published]

jobs:
  pypi:
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # required for Trusted Publishing
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build sdist and wheel
        run: |
          pip install build
          python -m build
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
